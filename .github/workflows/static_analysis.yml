name: Static analysis

on:
  pull_request:
  push:
    branches:
      - master
      - staging
  workflow_dispatch:

permissions:
  contents: read

jobs:
  swiftlint:
    name: SwiftLint
    runs-on: macos-15
    timeout-minutes: 15
    env:
      SWIFTLINT_VERSION: 0.65.1
      SWIFTLINT_SHA256: c1e429b0599cf1b516f369a2d9ec04eaf0e436f3c12b637df8851fa52ff694d0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Install SwiftLint
        run: |
          curl -fsSL -o "$RUNNER_TEMP/swiftlint.zip" "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/portable_swiftlint.zip"
          echo "${SWIFTLINT_SHA256}  $RUNNER_TEMP/swiftlint.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/swiftlint.zip" -d "$RUNNER_TEMP/swiftlint"

      # On pull requests the base branch is linted too, so that only findings it lacks can fail the job.
      - name: Lint the SDK
        run: |
          # Lints the SDK sources of the checkout in $1, writing SARIF to $2. SwiftLint exits with 2 for error-level findings.
          lint() {
            code=0
            (cd "$1" && "$RUNNER_TEMP/swiftlint/swiftlint" lint --quiet --config "$GITHUB_WORKSPACE/.github/swiftlint.yml" \
              --reporter sarif Sources > "$2") || code=$?
            [ "$code" -eq 0 ] || [ "$code" -eq 2 ]
          }
          lint "$GITHUB_WORKSPACE" "$RUNNER_TEMP/swiftlint.sarif"
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            # The first parent of the pull request's merge commit is the base branch it merges into.
            git worktree add "$RUNNER_TEMP/base" HEAD^1
            lint "$RUNNER_TEMP/base" "$RUNNER_TEMP/swiftlint-base.sarif"
          fi

      # Every finding goes to the job summary; a new one at warning or error level fails the job.
      - name: Summarize the findings
        run: |
          # The default shell has no pipefail, and without it tee would hide the summary's exit code.
          set -o pipefail
          base=()
          if [ -f "$RUNNER_TEMP/swiftlint-base.sarif" ]; then
            base=(--base "$RUNNER_TEMP/swiftlint-base.sarif" --base-root "$RUNNER_TEMP/base")
          fi
          python3 .github/scripts/sarif_summary.py SwiftLint "$RUNNER_TEMP/swiftlint.sarif" "${base[@]}" | tee -a "$GITHUB_STEP_SUMMARY" "$RUNNER_TEMP/static-analysis.md"

      - name: Write the CI report fragment
        if: ${{ !cancelled() }}
        run: |
          [ -s "$RUNNER_TEMP/static-analysis.md" ] || exit 0
          new=$(sed -n 's/^### New compared with the base branch: \([0-9][0-9]*\)$/\1/p' "$RUNNER_TEMP/static-analysis.md")
          case "$new" in
            '') summary=$(sed -n '1s/^### //p' "$RUNNER_TEMP/static-analysis.md") ;;
            0) summary="No new findings" ;;
            1) summary="1 new finding" ;;
            *) summary="$new new findings" ;;
          esac
          mkdir -p "$RUNNER_TEMP/ci-report-static-analysis"
          {
            printf 'Static analysis\n%s\n' "$summary"
            cat "$RUNNER_TEMP/static-analysis.md"
          } > "$RUNNER_TEMP/ci-report-static-analysis/report.md"

      - name: Upload the CI report fragment
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-report-static-analysis
          path: ${{ runner.temp }}/ci-report-static-analysis
          if-no-files-found: ignore
