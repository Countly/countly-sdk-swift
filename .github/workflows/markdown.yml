name: Lint the Markdown files

permissions:
  contents: read

on:
  push:
    branches:
      - master
      - staging
  pull_request:
    branches:
      - master
      - staging
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The rules are the shared ones in .markdownlint.json, the same file every Countly SDK
  # repository has, so README, CHANGELOG and the migration guides read alike everywhere.
  markdownlint:
    name: markdownlint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout SDK code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Lint the Markdown files
        run: npx --yes markdownlint-cli@0.44.0 "**/*.md" --ignore node_modules
