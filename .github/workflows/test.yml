name: Test the SDK

# `contents: read` is what lets actions/checkout clone. Declaring any permissions
# block replaces the default token scopes outright rather than adding to them, so
# leaving it out drops read access to the repository itself: on a private repo the
# clone then fails with "Repository not found", which is how GitHub reports an
# unauthorised read.
permissions:
  contents: read
  checks: write
  pull-requests: write

on:
  push:
    branches:
      - master
      - staging
  pull_request:
    branches:
      - master
      - staging
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # macOS is the cheap pass: `swift test` runs on the runner itself with no simulator to boot,
  # so it is the one that gates the pull request. It is also where the whole suite has to be
  # green, because the simulator cells below are advisory.
  macos:
    name: swift test (macOS)
    runs-on: macos-15
    steps:
      - name: Checkout SDK code
        uses: actions/checkout@v4

      - name: Set up Xcode
        run: sudo xcode-select -switch /Applications/Xcode_16.4.app

      # `--parallel` is deliberately not used. Several suites assert on the process wide
      # crash handler installation and on UserDefaults, which are shared across test cases
      # even though each case builds its own SDK instance.
      #
      # `--xunit-output` is SwiftPM's own JUnit writer, so the macOS results need no
      # conversion step at all -- unlike the simulator jobs below, which only get an
      # `.xcresult` bundle out of xcodebuild. It is written whether the suite passes or fails.
      - name: Run the test suite
        run: |
          mkdir -p test-results
          swift test --enable-code-coverage --xunit-output test-results/macOS.xml

      # Guards against the report being quietly empty: SwiftPM exits zero on an empty test
      # selection, and a JUnit file with no `<testcase>` in it reads downstream as a clean run.
      - name: Check that the macOS results are not empty
        if: always()
        run: |
          set -euo pipefail
          if [ ! -s test-results/macOS.xml ]; then
            echo "::error::swift test did not write test-results/macOS.xml"
            exit 1
          fi
          count=$(grep -c '<testcase' test-results/macOS.xml || true)
          echo "macOS: $count test cases recorded."
          if [ "$count" -eq 0 ]; then
            echo "::error::the macOS JUnit report contains no test cases"
            exit 1
          fi

      - name: Upload the macOS test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-macOS
          path: test-results/macOS.xml
          if-no-files-found: warn

      # llvm-cov needs the binary and the profdata that `swift test` leaves in .build, and
      # their names depend on the toolchain, so they are resolved rather than hardcoded.
      #
      # `report` is the human readable table that lands in the job log; `export -summary-only`
      # is the same data as JSON, which is what the per file table in the pull request comment
      # is built from. Parsing llvm-cov's fixed width text would be the brittle way to do it.
      - name: Report code coverage
        if: always()
        run: |
          set -euo pipefail
          binary=$(swift build --show-bin-path)/CountlyPackageTests.xctest/Contents/MacOS/CountlyPackageTests
          profdata=$(swift build --show-bin-path)/codecov/default.profdata
          if [ ! -f "$binary" ] || [ ! -f "$profdata" ]; then
            echo "::warning::coverage inputs are missing, skipping the report"
            exit 0
          fi
          xcrun llvm-cov report "$binary" \
            -instr-profile "$profdata" \
            -ignore-filename-regex='(Tests|\.build)/' \
            | tee coverage.txt
          xcrun llvm-cov export "$binary" \
            -instr-profile "$profdata" \
            -ignore-filename-regex='(Tests|\.build)/' \
            -summary-only -format=text > llvm-cov-export.json
          mkdir -p coverage
          python3 .github/scripts/coverage_summary.py \
            --platform macOS \
            --llvm-cov-export llvm-cov-export.json \
            --output coverage/macOS.json

      - name: Upload the coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-macOS
          path: |
            coverage/macOS.json
            coverage.txt
          if-no-files-found: ignore

  # The other four platforms need a simulator, which is slow to boot and, on watchOS and
  # visionOS, occasionally missing a runtime on the runner image. `continue-on-error` makes
  # these advisory: a red cell is reported and worth looking at, but the macOS job above is
  # what decides whether the pull request is green.
  #
  # Only the newest Xcode row is covered. The account has a single concurrent macOS runner, so
  # every matrix cell runs strictly after the previous one, and widening this to the other
  # rows would put a pull request into the hours.
  simulators:
    name: xcodebuild test (${{ matrix.platform }})
    needs: macos
    runs-on: macos-15
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        platform: [iOS, tvOS, watchOS, visionOS]
    steps:
      - name: Checkout SDK code
        uses: actions/checkout@v4

      - name: Set up Xcode
        run: sudo xcode-select -switch /Applications/Xcode_16.4.app

      # Resolved before anything expensive so a runner image missing the runtime fails fast.
      # `xcodebuild -showdestinations` only reports placeholder simulator entries on the runner
      # images, so this goes through simctl: take the newest installed runtime for the
      # platform, and create a device when the image ships a runtime without any.
      - name: Resolve the test destination
        id: destination
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          python3 - <<'PYEOF'
          import json, os, subprocess, sys

          PLATFORM = os.environ["PLATFORM"]
          # simctl calls visionOS runtimes "xrOS".
          simctl_platform = "xrOS" if PLATFORM == "visionOS" else PLATFORM

          def version(text):
              return tuple(int(c) if c.isdigit() else 0 for c in text.split("."))

          listing = subprocess.run(["xcrun", "simctl", "list", "-j"], capture_output=True, text=True)
          if listing.returncode != 0:
              sys.exit("::error::xcrun simctl list failed: %s" % listing.stderr.strip())
          listing = json.loads(listing.stdout)

          runtimes = [
              r for r in listing["runtimes"]
              if r.get("isAvailable") and r.get("platform") == simctl_platform
          ]
          if not runtimes:
              sys.exit("::error::No %s simulator runtime is installed on this runner." % PLATFORM)

          runtime = max(runtimes, key=lambda r: version(r.get("version", "0")))

          usable = [d for d in listing["devices"].get(runtime["identifier"], []) if d.get("isAvailable")]
          if usable:
              udid = usable[0]["udid"]
          else:
              types = runtime.get("supportedDeviceTypes") or []
              if not types:
                  sys.exit("::error::No device type supports %s %s." % (PLATFORM, runtime.get("version")))
              udid = subprocess.run(
                  ["xcrun", "simctl", "create", "cly-ci", types[0]["identifier"], runtime["identifier"]],
                  capture_output=True, text=True, check=True).stdout.strip()
              print("Created a %s '%s' on %s" % (PLATFORM, types[0]["name"], runtime.get("version")))

          destination = "platform=%s Simulator,id=%s" % (PLATFORM, udid)
          print("Testing on %s (runtime %s)" % (destination, runtime.get("version")))
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write("destination=%s\n" % destination)
          PYEOF

      # Coverage is instrumented on iOS only. It is the widest build -- it is the one that
      # compiles `WebViewManager`, `OverlayWindow` and the notification service, which macOS
      # leaves out -- so it is the number worth having next to the macOS one. Instrumenting
      # the other three would add runner time for figures nobody reads, on a single concurrent
      # macOS runner where every matrix cell is serialised behind the last.
      - name: Run the test suite
        run: |
          xcodebuild test \
            -scheme Countly-Package \
            -destination '${{ steps.destination.outputs.destination }}' \
            -resultBundlePath TestResults.xcresult \
            -enableCodeCoverage ${{ matrix.platform == 'iOS' && 'YES' || 'NO' }} \
            CODE_SIGNING_ALLOWED=NO

      # xcodebuild writes an .xcresult bundle, and the reporting action consumes JUnit XML.
      # The converter reads the structured bundle with xcresulttool rather than scraping
      # xcodebuild's console output the way xcbeautify and xcpretty do, and it exits non-zero
      # rather than writing a report with no tests in it. See the script's own docstring.
      - name: Convert the results to JUnit XML
        if: always()
        run: |
          python3 .github/scripts/xcresult_to_junit.py \
            --xcresult TestResults.xcresult \
            --platform ${{ matrix.platform }} \
            --output test-results/${{ matrix.platform }}.xml

      - name: Summarise the iOS coverage
        if: always() && matrix.platform == 'iOS'
        run: |
          set -euo pipefail
          xcrun xccov view --report --json TestResults.xcresult > xccov.json
          xcrun xccov view --report --only-targets TestResults.xcresult || true
          python3 .github/scripts/coverage_summary.py \
            --platform iOS \
            --xccov xccov.json \
            --output coverage/iOS.json

      - name: Upload the JUnit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ matrix.platform }}
          path: test-results/${{ matrix.platform }}.xml
          if-no-files-found: warn

      - name: Upload the coverage summary
        if: always() && matrix.platform == 'iOS'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-iOS
          path: coverage/iOS.json
          if-no-files-found: warn

      # Only on failure: a green run's result bundle is tens of megabytes nobody opens.
      - name: Upload the test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.platform }}
          path: TestResults.xcresult
          if-no-files-found: ignore

  # Everything above uploads; this is the only job that reports. It is deliberately a separate
  # job rather than a step on each platform: five jobs each posting their own comment is how a
  # branch ends up with twenty bot comments, and a per platform comparison table cannot be
  # written by a job that only knows about its own platform.
  #
  # ubuntu-latest, not macos: this job downloads artifacts and runs python, and the account has
  # a single concurrent macOS runner that the test jobs above should not have to queue behind.
  report:
    name: Report the results on the pull request
    needs: [macos, simulators]
    # `always()` is load bearing twice over. Without it a failing macOS job would skip this and
    # produce no report, which is exactly the run where the report matters most; and
    # `simulators` is skipped outright when `macos` fails, which would otherwise skip this too.
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      # Only for the scripts under .github/scripts; nothing here builds.
      - name: Checkout SDK code
        uses: actions/checkout@v4

      # `merge-multiple` flattens junit-macOS, junit-iOS, ... into one directory. The files
      # inside are named after their platform, so nothing collides.
      - name: Download the JUnit results
        uses: actions/download-artifact@v4
        with:
          pattern: junit-*
          path: junit
          merge-multiple: true

      - name: Download the coverage summaries
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          path: coverage
          merge-multiple: true

      # The check run with the per test drill down and the inline annotations. `comment_mode`
      # is off on purpose: the sticky comment below is the single comment this workflow owns,
      # and a second bot comment would just split the same result across two places.
      #
      # Skipped on a fork pull request, where GITHUB_TOKEN is read only and writing a check
      # would fail. The report still reaches the run summary, which needs no write access.
      - name: Publish the test results as a check
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          check_name: "Test Results :rocket:"
          comment_title: "Test Results :rocket:"
          comment_mode: off
          # The macOS job already failed the run if it had to. This step reports.
          action_fail: false
          action_fail_on_inconclusive: false
          files: |
            junit/*.xml

      # Writes ci-report.md and appends the same body to the run summary, so the report exists
      # even on a fork pull request or a push with no pull request open.
      - name: Render the report
        if: always()
        run: |
          python3 .github/scripts/ci_report.py \
            --junit-dir junit \
            --coverage-dir coverage \
            --simulators-result '${{ needs.simulators.result }}' \
            --output ci-report.md

      # One comment, updated in place, keyed by the HTML marker. The alternative is a new
      # comment on every push, which nobody reads after the third one.
      - name: Comment the report on the pull request
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- countly-swift-ci-report -->';
            let report = '';
            try {
              report = fs.readFileSync('ci-report.md', 'utf8');
            } catch (e) {
              report = 'The report step did not produce a report. See the workflow logs.';
            }
            const body = [
              marker,
              report,
              '',
              `[Full run log](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Upload the rendered report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-report
          path: ci-report.md
          if-no-files-found: warn
